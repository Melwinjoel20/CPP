name: Build EasyCart (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repository
      # -------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------
      # 2. Install Python
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # -------------------------------------
      # 3. Install dependencies
      # -------------------------------------
      - name: Install Python dependencies
        run: |
          pip install -r EasyCart/requirements.txt

      # -------------------------------------
      # 4. SonarCloud Scan
      # -------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=Melwinjoel20_CPP
            -Dsonar.organization=melwinjoel20
            -Dsonar.projectBaseDir=EasyCart
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------
      # 5. Create deployment bundle
      # -------------------------------------
      - name: Create deployment bundle
        run: |
          cd EasyCart
          zip -r ../app.zip . \
            -x "env/*" "**/__pycache__/*" ".git/*" ".github/*" "*.pyc" "*.egg-info/*"

      # -------------------------------------
      # 6. Upload build artifact
      # -------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: easycart-app-zip
          path: ./app.zip
          retention-days: 5
